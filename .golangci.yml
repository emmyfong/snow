version: "2"

linters:
  enable:
    - depguard
    - errorlint
    - revive
  settings:
    depguard:
      rules:
        client-uses-api-only:
          files: ["**/internal/client/**"]
          deny:
            - { pkg: "github.com/emmyfong/snow/internal/server", desc: "the client talks to the server only through pkg/api" }
            - { pkg: "github.com/emmyfong/snow/internal/provider", desc: "server-side package; use pkg/api" }
            - { pkg: "github.com/emmyfong/snow/internal/credential", desc: "server-side package; holds API keys; use pkg/api" }
            - { pkg: "github.com/emmyfong/snow/internal/signin", desc: "handles API keys; the chat's /login goes through the server" }
            - { pkg: "github.com/emmyfong/snow/internal/gate", desc: "server-side package; use pkg/api" }
            - { pkg: "github.com/emmyfong/snow/internal/skills", desc: "server-side package; use pkg/api" }
            - { pkg: "github.com/emmyfong/snow/internal/store", desc: "server-side package; use pkg/api" }
            - { pkg: "github.com/emmyfong/snow/internal/convstore", desc: "server-side package; the server owns conversation files; use pkg/api" }
            - { pkg: "github.com/emmyfong/snow/internal/agent", desc: "server-side package; agents run in the server; use pkg/api" }
            - { pkg: "github.com/emmyfong/snow/internal/tool", desc: "server-side package; tools run in the server; use pkg/api" }
        convstore-keeps-its-own-format:
          files: ["**/internal/convstore/**", "!$test"]
          deny:
            - { pkg: "github.com/emmyfong/snow/internal/provider", desc: "conversation files have their own record types, so a provider change is never a file format change; the agent loop converts" }
        provider-gets-keys-through-keysource:
          files: ["**/internal/provider/**", "!$test"]
          deny:
            - { pkg: "github.com/emmyfong/snow/internal/credential", desc: "providers read keys through provider.KeySource, so the key store can change without them" }
        charm-x-only-in-term:
          files: ["$all", "!**/internal/term/**"]
          deny:
            - { pkg: "github.com/charmbracelet/x/xpty", desc: "experimental; use internal/term" }
            - { pkg: "github.com/charmbracelet/x/vt", desc: "experimental; use internal/term" }
            - { pkg: "github.com/creack/pty", desc: "use internal/term" }
        api-is-public:
          files: ["**/pkg/api/**"]
          deny:
            - { pkg: "github.com/emmyfong/snow/internal", desc: "pkg/api is public and must not expose internal types" }
        leaf-packages:
          files: ["**/internal/term/**", "**/internal/layout/**", "**/internal/shell/**", "**/internal/config/**", "!$test"]
          deny:
            - { pkg: "github.com/emmyfong/snow", desc: "term, layout, shell, and config are leaf packages and import no other Snow package" }
        agent-sits-below-server:
          files: ["**/internal/agent/**", "!$test"]
          deny:
            - { pkg: "github.com/emmyfong/snow/internal/server", desc: "the server runs agents; agents never call back into it" }
            - { pkg: "github.com/emmyfong/snow/internal/client", desc: "agents report through events; the server forwards them" }
            - { pkg: "github.com/emmyfong/snow/internal/credential", desc: "agents never read keys; providers get them through KeySource" }
            - { pkg: "github.com/emmyfong/snow/internal/signin", desc: "sign-in belongs to the server and snow auth" }
        claudecode-uses-documented-surfaces:
          # An allow list: this package touches Claude Code's hooks and
          # settings only, so nothing that holds keys or logins can creep in.
          list-mode: strict
          files: ["**/internal/claudecode/**", "!$test"]
          allow:
            - $gostd
            - github.com/emmyfong/snow/pkg/api
            - github.com/emmyfong/snow/internal/transport
        tools-know-only-shell:
          files: ["**/internal/tool/**", "!$test"]
          deny:
            - { pkg: "github.com/emmyfong/snow/internal/agent", desc: "the agent calls tools; tools never call back into it" }
            - { pkg: "github.com/emmyfong/snow/internal/server", desc: "tools get what they need through tool.Env" }
            - { pkg: "github.com/emmyfong/snow/internal/convstore", desc: "the agent saves results; tools only return them" }
            - { pkg: "github.com/emmyfong/snow/internal/provider", desc: "tools do not talk to models" }
            - { pkg: "github.com/emmyfong/snow/internal/credential", desc: "tools never see keys" }
        mcp-uses-api-and-transport:
          # An allow list: snow mcp speaks the protocol and nothing that
          # holds keys or server state.
          list-mode: strict
          files: ["**/internal/mcp/**", "!$test"]
          allow:
            - $gostd
            - github.com/emmyfong/snow/pkg/api
            - github.com/emmyfong/snow/internal/transport

formatters:
  enable:
    - gofmt
