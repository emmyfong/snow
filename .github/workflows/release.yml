# Release steps (the user's; CI pushes nothing anywhere but the release):
#
# 1. Check that CI is green on main, then tag and push the tag:
#      git tag v0.1.0 && git push origin v0.1.0
#    This workflow builds the archives, .deb packages, checksums.txt, and
#    the Scoop and winget manifests, and publishes a GitHub release.
# 2. Scoop: download snow.json from the release and commit it as
#    bucket/snow.json in the next pull request.
# 3. winget: download the three EmmyFong.snow*.yaml files, check them with
#    winget validate --manifest <folder>, and open a pull request to
#    microsoft/winget-pkgs under manifests/e/EmmyFong/snow/<version>/.
#
# Check a change to .goreleaser.yaml locally with
#   goreleaser release --snapshot --clean
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser needs the full history and tags for the version and
          # the changelog.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GoReleaser writes the Scoop and winget manifests but pushes them
      # nowhere (steps at the top); attach them to the release instead.
      - name: Attach package manifests
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/scoop/snow.json --clobber
          find dist/winget -name '*.yaml' -print0 | xargs -0 -r gh release upload "$GITHUB_REF_NAME" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
