name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser needs the full history and tags for the version and
          # the changelog.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GoReleaser writes the Scoop and winget manifests but pushes them
      # nowhere (packaging/README.md); attach them to the release instead.
      - name: Attach package manifests
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/scoop/snow.json --clobber
          find dist/winget -name '*.yaml' -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
