name: Epic
description: One concern a user can name. One PR closes it and all its sub-issues. Add one priority label.
labels: [epic]
body:
  - type: textarea
    id: why
    attributes: { label: Why }
    validations: { required: true }
  - type: textarea
    id: concept-map
    attributes: { label: Concept map, description: "ASCII diagram of the surfaces and pieces, with child issues placed on it.", render: text }
    validations: { required: true }
  - type: textarea
    id: children
    attributes: { label: Sub-issues, description: "Table: order, sub-issue, priority, blocked by." }
    validations: { required: true }
  - type: textarea
    id: done
    attributes: { label: Definition of done }
    validations: { required: true }
  - type: textarea
    id: related
    attributes: { label: Related epics }
