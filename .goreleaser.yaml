# GoReleaser builds the release archives. The release workflow runs it on
# v* tags. Check a change locally with one build at a time (the default runs
# one per CPU and can exhaust memory on a laptop):
#   GOFLAGS=-p=2 goreleaser release --snapshot --clean --parallelism 1
version: 2

project_name: snow

builds:
  - id: snow
    main: ./cmd/snow
    binary: snow
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - id: snow
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # No version in the name, so releases/latest/download/<name> always
    # points at the newest archive.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Linux: a .deb beside the tar.gz. install.sh (in the repository root)
# installs the tar.gz for any distribution.
nfpms:
  - id: snow
    package_name: snow
    file_name_template: "{{ .ProjectName }}_{{ .Arch }}"
    formats: [deb]
    homepage: https://github.com/emmyfong/snow
    maintainer: Emmy Fong <emmyfong@users.noreply.github.com>
    description: A terminal for directing AI coding agents, with sessions that survive a reboot.
    license: MIT
    bindir: /usr/bin

# Windows: the winget manifests are written to dist/ and attached to the
# release, never pushed by CI. They are not submitted to
# microsoft/winget-pkgs yet; Windows users run install.ps1.
winget:
  - name: snow
    publisher: Emmy Fong
    publisher_url: https://github.com/emmyfong
    short_description: A terminal for directing AI coding agents.
    description: Snow runs shells in panes and windows, like tmux, with sessions that survive a reboot. It runs natively on Windows and in WSL.
    license: MIT
    homepage: https://github.com/emmyfong/snow
    skip_upload: true
    repository:
      owner: emmyfong
      name: winget-pkgs

# macOS: the Homebrew cask is written to dist/ and attached to the release,
# never pushed by CI, like the winget manifests. No tap repository exists
# yet. The binary is not signed (#369), so the cask clears the quarantine
# attribute that would stop it on first launch.
homebrew_casks:
  - name: snow
    ids: [snow]
    binaries: [snow]
    homepage: https://github.com/emmyfong/snow
    description: A terminal for directing AI coding agents.
    skip_upload: true
    repository:
      owner: emmyfong
      name: homebrew-tap
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/snow"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"
      - "^ci"

release:
  prerelease: auto
